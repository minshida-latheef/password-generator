<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="result-container">
            <input type="text" id="password-display" readonly placeholder="Click Generate">
            <button id="copy-btn" title="Copy to clipboard">Copy</button>
        </div>

        <div class="settings">
            <div class="setting">
                <label>Length: <span id="length-val">12</span></label>
                <input type="range" id="length-slider" min="6" max="30" value="12">
            </div>
            
            <div class="setting">
                <label>
                    <input type="checkbox" id="uppercase" checked> Include Uppercase (A-Z)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="lowercase" checked> Include Lowercase (a-z)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="numbers" checked> Include Numbers (0-9)
                </label>
            </div>

            <div class="setting">
                <label>
                    <input type="checkbox" id="symbols"> Include Symbols (!@#$%^&*)
                </label>
            </div>
        </div>

        <div class="strength-container">
            <span>Strength:</span>
            <span id="strength-text" class="strength-medium">Medium</span>
        </div>

        <button id="generate-btn" class="generate-btn">Generate Password</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
